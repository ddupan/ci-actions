name: Setup Artifact Keeper
description: Route CI dependency downloads through the anonymous Artifact Keeper pull-through caches
inputs:
  url:
    default: https://artifacts.lab.ddupan.top
  go:
    default: 'false'
  go-version-file:
    description: Install the Go toolchain this go.mod asks for from the cache (golang.org/toolchain module), replacing actions/setup-go
    default: ''
  pypi:
    default: 'false'
  uv:
    description: Install this exact uv version from the cache (GitHub release), replacing astral-sh/setup-uv; implies pypi
    default: ''
  ansible:
    default: 'false'
  docker:
    default: 'false'
  gradle:
    default: 'false'
  npm:
    default: 'false'
  terraform:
    default: 'false'
  npm-home:
    description: HOME that npm runs with (e.g. a directory mounted into a build container)
    default: ''
  gradle-user-home:
    description: Where Gradle runs with GRADLE_USER_HOME (e.g. a directory mounted into a build container)
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        AK_URL: ${{ inputs.url }}
        ENABLE_GO: ${{ inputs.go }}
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
        ENABLE_PYPI: ${{ inputs.pypi }}
        UV_VERSION_INPUT: ${{ inputs.uv }}
        ENABLE_ANSIBLE: ${{ inputs.ansible }}
        ENABLE_DOCKER: ${{ inputs.docker }}
        ENABLE_GRADLE: ${{ inputs.gradle }}
        ENABLE_NPM: ${{ inputs.npm }}
        ENABLE_TERRAFORM: ${{ inputs.terraform }}
        NPM_HOME_INPUT: ${{ inputs.npm-home }}
        GRADLE_HOME_INPUT: ${{ inputs.gradle-user-home }}
      run: |
        set -euo pipefail
        url="${AK_URL%/}"
        if [[ "$ENABLE_GO" == true ]]; then
          # Own modules are not on the public proxy or sumdb.
          printf '%s\n' "GOPROXY=$url/go/go-proxy" 'GOPRIVATE=git.ddupan.top' >> "$GITHUB_ENV"
        fi
        if [[ -n "$GO_VERSION_FILE" ]]; then
          # Go releases are published as golang.org/toolchain modules, so the Go module cache serves them too.
          toolchains="$url/go/go-proxy/golang.org/toolchain/@v"
          arch=$(uname -m); arch=${arch/x86_64/amd64}; arch=${arch/aarch64/arm64}
          version=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); t = $2 } $1 == "go" { g = $2 } END { print t ? t : g }' "$GO_VERSION_FILE")
          if [[ "$version" != *.*.* ]]; then
            # "go 1.27": the latest 1.27.x release, as actions/setup-go resolves it.
            version=$(curl -fsS --retry 3 --retry-all-errors "$toolchains/list" |
              sed -n "s/^v0\.0\.1-go\(${version//./\\.}\.[0-9]*\)\.linux-$arch\$/\1/p" | sort -V | tail -n 1)
          fi
          [[ -n "$version" ]] || { echo "no Go toolchain found for $GO_VERSION_FILE" >&2; exit 1; }
          module="v0.0.1-go$version.linux-$arch"
          curl -fsS --retry 3 --retry-all-errors -o "$RUNNER_TEMP/go.zip" "$toolchains/$module.zip"
          unzip -q -o "$RUNNER_TEMP/go.zip" -d "$RUNNER_TEMP/go"
          rm "$RUNNER_TEMP/go.zip"
          echo "$RUNNER_TEMP/go/golang.org/toolchain@$module/bin" >> "$GITHUB_PATH"
          echo "installed Go $version"
        fi
        if [[ -n "$UV_VERSION_INPUT" ]]; then
          # setup-uv downloads from Astral's mirror or GitHub Releases, i.e. over the flaky WAN on every
          # ephemeral runner; the cache's github-releases repository serves the same release asset.
          releases="$url/api/v1/repositories/github-releases/download"
          asset="uv-$(uname -m)-unknown-linux-gnu.tar.gz"
          base="$releases/astral-sh/uv/releases/download/$UV_VERSION_INPUT"
          dir="$RUNNER_TEMP/uv-$UV_VERSION_INPUT"
          mkdir -p "$dir"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/$asset" "$base/$asset"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/$asset.sha256" "$base/$asset.sha256"
          (cd "$dir" && sha256sum -c --quiet "$asset.sha256")
          tar -xzf "$dir/$asset" -C "$dir" --strip-components=1
          rm "$dir/$asset" "$dir/$asset.sha256"
          # ~/.local/bin: where `uv tool install` and `uv python install` put executables.
          printf '%s\n' "$dir" "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Managed Pythons (python-build-standalone) come through the same cache.
          echo "UV_PYTHON_INSTALL_MIRROR=$releases/astral-sh/python-build-standalone/releases/download" >> "$GITHUB_ENV"
          "$dir/uv" --version
          ENABLE_PYPI=true
        fi
        if [[ "$ENABLE_PYPI" == true ]]; then
          printf '%s\n' "PIP_INDEX_URL=$url/pypi/pypi-proxy/simple/" \
            "UV_DEFAULT_INDEX=$url/pypi/pypi-proxy/simple/" >> "$GITHUB_ENV"
        fi
        if [[ "$ENABLE_ANSIBLE" == true ]]; then
          printf 'ANSIBLE_GALAXY_SERVER=%s/ansible/galaxy-proxy\n' "$url" >> "$GITHUB_ENV"
        fi
        if [[ "$ENABLE_GRADLE" == true ]]; then
          # Gradle may run in a container without the job env, so the URL is written into the script.
          init_d="${GRADLE_HOME_INPUT:-${GRADLE_USER_HOME:-$HOME/.gradle}}/init.d"
          mkdir -p "$init_d"
          cat > "$init_d/artifact-keeper.gradle" <<GRADLE
          // Written by ci-actions/setup-artifact-keeper: Maven Central and the Gradle Plugin Portal go through
          // the Artifact Keeper pull-through caches.
          def central = '$url/maven/maven-central'
          def pluginPortal = '$url/maven/gradle-plugins'

          def redirect = { repos ->
              repos.withType(MavenArtifactRepository).configureEach { repo ->
                  def url = repo.url.toString()
                  if (url.startsWith('https://repo.maven.apache.org/maven2') || url.startsWith('https://repo1.maven.org/maven2')) {
                      repo.url = central
                  } else if (url.startsWith('https://plugins.gradle.org/m2')) {
                      repo.url = pluginPortal
                  }
              }
          }

          beforeSettings { settings ->
              redirect(settings.pluginManagement.repositories)
              redirect(settings.dependencyResolutionManagement.repositories)
          }
          settingsEvaluated { settings ->
              // No pluginManagement repositories means the implicit Plugin Portal, which cannot be redirected.
              if (settings.pluginManagement.repositories.isEmpty()) {
                  settings.pluginManagement.repositories.maven { url = pluginPortal }
              }
          }
          allprojects {
              redirect(buildscript.repositories)
              redirect(repositories)
          }
        GRADLE
        fi
        if [[ "$ENABLE_NPM" == true ]]; then
          # A user .npmrc rather than an env var, so npm in a build container with this HOME sees it too.
          # npm rewrites registry.npmjs.org URLs in package-lock.json to the configured registry.
          npm_home="${NPM_HOME_INPUT:-$HOME}"
          # The file may come back from actions/cache or a persistent runner; keep one registry line.
          mkdir -p "$npm_home"
          touch "$npm_home/.npmrc"
          sed -i '/^registry=/d' "$npm_home/.npmrc"
          echo "registry=$url/npm/npm-proxy/" >> "$npm_home/.npmrc"
        fi
        if [[ "$ENABLE_TERRAFORM" == true ]]; then
          # Provider Network Mirror for the public registry only; other hosts (our signed registry) stay direct.
          # A lock file's hashes are still checked against what the mirror serves.
          cat > "$RUNNER_TEMP/artifact-keeper.tfrc" <<TFRC
        provider_installation {
          network_mirror {
            url     = "$url/terraform/terraform-proxy/"
            include = ["registry.terraform.io/*/*"]
          }
          direct {
            exclude = ["registry.terraform.io/*/*"]
          }
        }
        TFRC
          printf 'TF_CLI_CONFIG_FILE=%s\n' "$RUNNER_TEMP/artifact-keeper.tfrc" >> "$GITHUB_ENV"
        fi
        if [[ "$ENABLE_DOCKER" == true ]]; then
          # The job dockerd is already running (job_started hook); registry-mirrors
          # is reloaded on SIGHUP.
          sudo install -d /etc/docker
          jq -n --arg m "$url" '{"registry-mirrors": [$m]}' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo pkill -HUP -x dockerd
          # docker-container builders ignore dockerd's mirrors; buildx create reads
          # this default config when no --buildkitd-config is given.
          buildx_config="$RUNNER_TEMP/buildx"
          mkdir -p "$buildx_config"
          printf '[registry."docker.io"]\n  mirrors = ["%s"]\n' "${url#https://}" \
            > "$buildx_config/buildkitd.default.toml"
          printf 'BUILDX_CONFIG=%s\n' "$buildx_config" >> "$GITHUB_ENV"
        fi

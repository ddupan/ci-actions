name: Security Scan
description: Run semgrep, gitleaks and trivy in report mode and summarise the findings as one PR comment
inputs:
  scanners:
    description: Comma-separated subset of semgrep,gitleaks,trivy
    default: semgrep,gitleaks,trivy
  semgrep-config:
    description: >-
      Space-separated semgrep --config values: registry rulesets (p/python, p/golang)
      or paths to rule files in the repository
    default: p/default
  comment:
    description: Post or update the summary as a comment on the pull request
    default: 'true'
  token:
    default: ${{ github.token }}
  cloud:
    description: >-
      Runner off the LAN (runs-on: [cloud]): download the scanners from GitHub and PyPI
      instead of the Artifact Keeper caches
    default: 'false'
runs:
  using: composite
  steps:
    # Plain binaries, no Docker, so the job also runs on the cloud pool. On the LAN the
    # downloads go through Artifact Keeper, so a GitHub hiccup does not fail the job.
    # Release archives are checked against the release's own checksums file.
    - name: Install scanners
      shell: bash
      env:
        SCANNERS: ${{ inputs.scanners }}
        CLOUD: ${{ inputs.cloud }}
        # Renovate bumps these lines.
        SEMGREP_VERSION: 1.186.0  # renovate: datasource=pypi depName=semgrep
        GITLEAKS_VERSION: 8.30.1  # renovate: datasource=github-releases depName=gitleaks/gitleaks
        TRIVY_VERSION: 0.76.2  # renovate: datasource=github-releases depName=aquasecurity/trivy
      run: |
        set -euo pipefail
        dir=$RUNNER_TEMP/security-scan
        bin=$dir/bin
        mkdir -p "$bin"
        echo "$bin" >> "$GITHUB_PATH"
        enabled() { [[ ",$SCANNERS," == *",$1,"* ]]; }
        if [[ "$CLOUD" == true ]]; then
          releases=https://github.com
          pypi=https://pypi.org/simple/
        else
          releases=https://artifacts.lab.ddupan.top/api/v1/repositories/github-releases/download
          pypi=https://artifacts.lab.ddupan.top/pypi/pypi-proxy/simple/
        fi
        release() {  # <owner/repo> <version> <archive> <checksums file> <binary>
          local url="$releases/$1/releases/download/v$2"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/$3" "$url/$3"
          curl -fsSL --retry 5 --retry-all-errors -o "$dir/$4" "$url/$4"
          # No line for the archive leaves sha256sum nothing to check, which fails too.
          (cd "$dir" && awk -v f="$3" '$2 == f' "$4" | sha256sum -c --quiet)
          tar -xzf "$dir/$3" -C "$bin" "$5"
        }
        if enabled semgrep; then
          python3 -m venv "$dir/venv"
          "$dir/venv/bin/pip" install --quiet --disable-pip-version-check --index-url "$pypi" \
            "semgrep==$SEMGREP_VERSION"
          ln -sf "$dir/venv/bin/semgrep" "$bin/semgrep"
        fi
        enabled gitleaks && release gitleaks/gitleaks "$GITLEAKS_VERSION" \
          "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" gitleaks
        enabled trivy && release aquasecurity/trivy "$TRIVY_VERSION" \
          "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" "trivy_${TRIVY_VERSION}_checksums.txt" trivy
        ls "$bin"

    # Findings never fail the step; a scanner error shows as ❌ in the report.
    # Per-repository tuning lives in each tool's own files in the repo
    # (.semgrepignore, .gitleaksignore, .gitleaks.toml, trivy.yaml, .trivyignore).
    - name: Scan
      shell: bash
      env:
        SCANNERS: ${{ inputs.scanners }}
        SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -uo pipefail
        out=$RUNNER_TEMP/security-scan/out
        mkdir -p "$out"
        enabled() { [[ ",$SCANNERS," == *",$1,"* ]]; }
        if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
          # The baseline needs the base commit and history back to the merge-base.
          [[ $(git rev-parse --is-shallow-repository) == true ]] && git fetch -q --unshallow origin
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch -q origin "$BASE_SHA"
          base=$(git merge-base "$BASE_SHA" HEAD)
          semgrep_args=(--baseline-commit "$base"); gitleaks_args=(--log-opts "$base..HEAD")
          scope="本 PR 新增（相对 ${base:0:10}）"
        else
          semgrep_args=(); gitleaks_args=(); scope='全量'
        fi

        if enabled semgrep; then
          configs=()
          for c in $SEMGREP_CONFIG; do configs+=(--config "$c"); done
          # Registry rulesets are fetched from semgrep.dev over the WAN on every run.
          # Exit code >=2 is an error; findings alone exit 0.
          for attempt in 1 2 3; do
            semgrep scan "${configs[@]}" --metrics=off --quiet --json \
              --output "$out/semgrep.json" "${semgrep_args[@]}" && break
            rm -f "$out/semgrep.json"; sleep $((attempt * 5))
          done
        fi

        # --redact keeps secrets out of the report; with --exit-code 0, non-zero means an error.
        if enabled gitleaks; then
          gitleaks git --no-banner --redact --exit-code 0 --report-format json \
            --report-path "$out/gitleaks.json" "${gitleaks_args[@]}" . || rm -f "$out/gitleaks.json"
        fi

        # Vulnerabilities only: secrets belong to gitleaks. The DB comes from mirror.gcr.io.
        if enabled trivy; then
          for attempt in 1 2 3; do
            trivy fs --scanners vuln --no-progress --quiet --format json \
              --output "$out/trivy.json" . && break
            rm -f "$out/trivy.json"; sleep $((attempt * 5))
          done
        fi

        python3 "$GITHUB_ACTION_PATH/report.py" "$out" "$scope" "$SCANNERS" \
          | tee "$RUNNER_TEMP/security-scan/report.md"

    - name: Comment
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        GITEA_TOKEN: ${{ inputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/pr_comment.py" "$RUNNER_TEMP/security-scan/report.md" security-scan

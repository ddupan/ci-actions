# 引用方都写 @v1：main 一更新就把 v1 移过去，不用手动打 tag。
name: Move major tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin v1

# 引用方都写 @v1：main 一更新就把 v1 移过去，不用手动打 tag。
name: Move major tag

on:
  push:
    branches: [main]

jobs:
  move:
    runs-on: [self-hosted, pod]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: |
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin v1
